<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">  
    <meta name="author" content="Simay Martinova">
    <meta name="description" content="PCloud">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCloud Translator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <div class="bg-primary text-white p-5 text-center">
      <div class="container-fluid p-5 text-white text-center" style="background-color: #fbfbfb;">
        <img src="pcloud.png" alt="logo" id="myImage">
  </head>
  <body>
    <div class="container">
      <div class="wrapper">
        <div class="text-input">
          <textarea spellcheck="false" class="from-text" placeholder="Enter text"></textarea>
          <textarea spellcheck="false" readonly disabled class="to-text" placeholder="Translation"></textarea>
        </div>
        <ul class="controls">
          <li class="row from">
            <div class="icons">
              <i id="from" class="fas fa-volume-up"></i>
              <i id="from" class="fas fa-copy"></i>
            </div>
            <select></select>
          </li>
          <li class="exchange"><i class="fas fa-exchange-alt"></i></li>
          <li class="row to">
            <select></select>
            <div class="icons">
              <i id="to" class="fas fa-volume-up"></i>
              <i id="to" class="fas fa-copy"></i>
            </div>
          </li>
        </ul>
        <div class="api-choice">
          <label>
            <input type="radio" name="api" value="prompt" checked>
            Use Prompt API
          </label>
          <label>
            <input type="radio" name="api" value="translate">
            Use Translate API
          </label>
        </div>
      </div>
      <button class="translate-btn">Translate Text</button>
      <button class="summarize-btn">Summarize Text</button>
    </div>

    <script src="javascript/countries.js"></script>
    <script src="javascript/index.js"></script>
  </body>
</html>
